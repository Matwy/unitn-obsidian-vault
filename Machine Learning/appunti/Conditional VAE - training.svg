<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="720" viewBox="0 0 1160 720" font-family="'Comic Sans MS','Segoe Print','Bradley Hand',cursive">
  <defs>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#cc0000"/>
    </marker>
    <marker id="arrK" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#222"/>
    </marker>
    <marker id="arrP" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#7a3fa3"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1160" height="720" fill="#fbfbf8"/>

  <!-- Title -->
  <text x="50" y="58" font-size="40" letter-spacing="2" fill="#3a3a3a">CONDITIONAL VAE — TRAINING IN PRACTICE</text>
  <line x1="52" y1="70" x2="690" y2="70" stroke="#bbb" stroke-width="1.5"/>

  <!-- p_data and sample arrow -->
  <text x="55" y="270" font-size="22" fill="#222">P</text>
  <text x="73" y="277" font-size="14" fill="#222">DATA</text>
  <path d="M115,262 C160,250 175,250 205,255" stroke="#cc0000" stroke-width="3" fill="none" marker-end="url(#arrR)"/>
  <text x="118" y="240" font-size="18" fill="#cc0000">SAMPLE</text>

  <!-- x input bar -->
  <rect x="225" y="200" width="20" height="110" rx="4" fill="#d9ead3" stroke="#6aa84f" stroke-width="2"/>
  <text x="228" y="335" font-size="24" fill="#222">x</text>

  <!-- Encoder funnel (narrows L->R) -->
  <polygon points="290,205 360,230 360,290 290,315" fill="#eef7e9" stroke="#6aa84f" stroke-width="2"/>
  <text x="300" y="190" font-size="19" fill="#222">ENCODER</text>
  <text x="298" y="263" font-size="17" fill="#222">q</text>
  <text x="310" y="269" font-size="13" fill="#222">φ</text>
  <text x="322" y="263" font-size="15" fill="#222">(w|x,c)</text>

  <!-- arrow x -> encoder -->
  <path d="M248,255 L288,255" stroke="#222" stroke-width="2" fill="none" marker-end="url(#arrK)"/>

  <!-- encoder splits to mean / cov -->
  <path d="M360,235 C400,215 440,200 470,190" stroke="#222" stroke-width="2" fill="none" marker-end="url(#arrK)"/>
  <path d="M360,285 C400,300 440,315 470,325" stroke="#222" stroke-width="2" fill="none" marker-end="url(#arrK)"/>

  <text x="478" y="180" font-size="17" fill="#3c8c2f">MEAN</text>
  <text x="478" y="205" font-size="22" fill="#3c8c2f">μ</text>
  <text x="495" y="211" font-size="14" fill="#3c8c2f">w|x,c</text>

  <text x="478" y="332" font-size="22" fill="#3c8c2f">Σ</text>
  <text x="495" y="338" font-size="14" fill="#3c8c2f">w|x,c</text>
  <text x="478" y="355" font-size="15" fill="#3c8c2f">COVARIANCE</text>

  <!-- gaussian (green) -->
  <ellipse cx="650" cy="250" rx="55" ry="26" fill="#d9ead3" stroke="#3c8c2f" stroke-width="2"/>
  <text x="608" y="256" font-size="19" fill="#222">GAUSSIAN</text>
  <path d="M560,205 C590,225 605,235 615,242" stroke="#3c8c2f" stroke-width="2" fill="none" marker-end="url(#arrK)"/>
  <path d="M560,320 C590,300 605,285 615,265" stroke="#3c8c2f" stroke-width="2" fill="none" marker-end="url(#arrK)"/>

  <!-- sample to w -->
  <path d="M705,255 C760,265 800,300 805,355" stroke="#cc0000" stroke-width="3" fill="none" marker-end="url(#arrR)"/>
  <text x="730" y="300" font-size="18" fill="#cc0000">SAMPLE</text>

  <!-- latent w bar -->
  <rect x="845" y="250" width="20" height="110" rx="4" fill="#ead1dc" stroke="#c27ba0" stroke-width="2"/>
  <text x="872" y="312" font-size="24" fill="#222">w</text>

  <!-- w -> decoder -->
  <path d="M860,360 C880,420 850,430 815,432" stroke="#222" stroke-width="2" fill="none" marker-end="url(#arrK)"/>

  <!-- Decoder funnel (expands L->R, drawn on right) -->
  <polygon points="810,410 740,385 740,470 810,495" fill="#fbeef4" stroke="#c27ba0" stroke-width="2"/>
  <text x="745" y="525" font-size="19" fill="#222">DECODER</text>
  <text x="748" y="455" font-size="17" fill="#222">q</text>
  <text x="760" y="461" font-size="13" fill="#222">θ</text>
  <text x="772" y="455" font-size="15" fill="#222">(x|w,c)</text>

  <!-- decoder splits to mean / cov -->
  <path d="M740,405 C700,385 660,372 632,365" stroke="#222" stroke-width="2" fill="none" marker-end="url(#arrK)"/>
  <path d="M740,475 C700,490 660,503 632,510" stroke="#222" stroke-width="2" fill="none" marker-end="url(#arrK)"/>

  <text x="630" y="352" font-size="22" fill="#a64d79">μ</text>
  <text x="647" y="358" font-size="14" fill="#a64d79">x|w,c</text>
  <text x="630" y="332" font-size="17" fill="#a64d79">MEAN</text>

  <text x="556" y="512" font-size="22" fill="#a64d79">Σ</text>
  <text x="573" y="518" font-size="14" fill="#a64d79">x|w,c</text>
  <text x="556" y="535" font-size="15" fill="#a64d79">COVARIANCE</text>

  <!-- gaussian (pink) -->
  <ellipse cx="430" cy="440" rx="55" ry="26" fill="#ead1dc" stroke="#a64d79" stroke-width="2"/>
  <text x="388" y="446" font-size="19" fill="#222">GAUSSIAN</text>
  <path d="M545,360 C510,390 480,410 470,425" stroke="#a64d79" stroke-width="2" fill="none" marker-end="url(#arrK)"/>
  <path d="M545,515 C510,490 480,470 470,455" stroke="#a64d79" stroke-width="2" fill="none" marker-end="url(#arrK)"/>

  <!-- reconstruction term arrow to loss -->
  <path d="M375,440 C300,440 260,435 235,432" stroke="#222" stroke-width="2" fill="none" marker-end="url(#arrK)"/>
  <text x="248" y="415" font-size="14" fill="#555">RECONSTRUCTION</text>
  <text x="280" y="430" font-size="14" fill="#555">TERM</text>

  <!-- Loss box -->
  <rect x="60" y="415" width="170" height="80" rx="6" fill="#fff2a8" stroke="#d4c54a" stroke-width="2"/>
  <text x="72" y="442" font-size="18" fill="#222">VARIATIONAL</text>
  <text x="72" y="463" font-size="18" fill="#222">LOWER BOUND</text>
  <text x="72" y="484" font-size="18" fill="#222">LOSS</text>

  <!-- prior p_w regularization -->
  <text x="55" y="370" font-size="17" fill="#222">P</text>
  <text x="67" y="376" font-size="12" fill="#222">w</text>
  <text x="78" y="370" font-size="17" fill="#222">= N(0, I)</text>
  <text x="55" y="392" font-size="12" fill="#777">REGULARIZATION TERM</text>
  <path d="M120,378 C130,395 135,402 140,412" stroke="#222" stroke-width="1.8" fill="none" marker-end="url(#arrK)"/>

  <!-- update -->
  <path d="M120,495 L120,540" stroke="#222" stroke-width="2" fill="none" marker-end="url(#arrK)"/>
  <text x="60" y="562" font-size="18" fill="#222">UPDATE  θ, φ</text>

  <!-- bottom regularization loop (w/decoder back to loss) -->
  <path d="M855,365 C900,560 700,640 400,640 C250,640 180,560 150,500" stroke="#222" stroke-width="1.8" fill="none" stroke-dasharray="2 0" marker-end="url(#arrK)"/>
  <text x="470" y="660" font-size="15" fill="#555">REGULARIZATION TERM   D</text>
  <text x="640" y="666" font-size="11" fill="#555">KL</text>
  <text x="652" y="660" font-size="15" fill="#555">( q(w|x,c) ‖ p(w) )</text>

  <!-- ===================== CONDITIONAL PART (purple) ===================== -->
  <!-- side info box -->
  <rect x="150" y="120" width="200" height="56" rx="10" fill="#efe1f7" stroke="#7a3fa3" stroke-width="2.5"/>
  <text x="200" y="146" font-size="20" fill="#7a3fa3">c  —  SIDE INFO</text>
  <text x="167" y="167" font-size="14" fill="#7a3fa3">(label / class / attribute)</text>

  <!-- c -> encoder input (joins x) -->
  <path d="M235,176 C232,188 234,192 236,198" stroke="#7a3fa3" stroke-width="2.5" fill="none" marker-end="url(#arrP)"/>
  <!-- c -> into encoder body -->
  <path d="M300,176 C310,188 318,196 322,205" stroke="#7a3fa3" stroke-width="2.5" fill="none" marker-end="url(#arrP)"/>

  <!-- c routed ALSO to decoder (dashed long path) -->
  <path d="M350,150 C620,120 1030,120 1010,360 C1000,440 900,448 815,452" stroke="#7a3fa3" stroke-width="2.5" fill="none" stroke-dasharray="9 6" marker-end="url(#arrP)"/>
  <text x="600" y="108" font-size="15" fill="#7a3fa3">same c conditions BOTH encoder AND decoder</text>

  <!-- ELBO caption box -->
  <rect x="600" y="560" width="540" height="95" rx="8" fill="#ffffff" stroke="#999" stroke-width="1.5"/>
  <text x="618" y="585" font-size="15" fill="#333">CVAE objective (ELBO):</text>
  <text x="618" y="612" font-size="16" fill="#222">L =  E[ log p</text>
  <text x="730" y="616" font-size="11" fill="#222">θ</text>
  <text x="740" y="612" font-size="16" fill="#222">(x | w, c) ]   −   D</text>
  <text x="895" y="616" font-size="11" fill="#222">KL</text>
  <text x="912" y="612" font-size="16" fill="#222">( q</text>
  <text x="932" y="616" font-size="11" fill="#222">φ</text>
  <text x="940" y="612" font-size="16" fill="#222">(w | x, c) ‖ p(w) )</text>
  <text x="618" y="640" font-size="13" fill="#7a3fa3">Difference vs VAE: c is concatenated to the encoder &amp; decoder inputs.</text>
</svg>
